<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NERV Visualiser</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="visualiser">
    <div class="app-shell page-shell">
      <header class="topbar">
        <a class="brand-anchor" href="index.html" aria-label="Open home screen">
          <span class="brand-mark">N</span>
          <div>
            <p class="eyebrow">Magi interface</p>
            <h1>NERV VISUALISER</h1>
          </div>
        </a>
        <div class="topbar-actions">
          <button class="ghost-button" id="toggleFullscreen" type="button">Full Screen</button>
        </div>
      </header>

      <main class="page-view">
        <section class="card single-page-card">
          <div class="card-header">
            <div>
              <p class="eyebrow">SONIC ANALYSIS</p>
              <h2>Live frequency profile</h2>
            </div>
            <div class="inline-status muted">IDLE</div>
          </div>

          <div class="visualiser-frame">
            <canvas id="visualiserCanvas" width="720" height="320" aria-label="Audio visualizer"></canvas>
          </div>

          <div class="visualiser-settings">
            <label class="mini-slider">
              <span>Bars</span>
              <input id="barCountControl" type="range" min="18" max="64" step="2" />
              <strong id="barCountValue">42</strong>
            </label>
            <label class="mini-slider">
              <span>Sensitivity</span>
              <input id="sensitivityControl" type="range" min="0.6" max="2.6" step="0.1" />
              <strong id="sensitivityValue">1.3</strong>
            </label>
            <label class="mini-slider">
              <span>Smoothing</span>
              <input id="smoothingControl" type="range" min="0.3" max="0.96" step="0.02" />
              <strong id="smoothingValue">0.82</strong>
            </label>
            <label class="mini-slider">
              <span>Intensity</span>
              <input id="intensityControl" type="range" min="0.4" max="1.6" step="0.1" />
              <strong id="intensityValue">0.8</strong>
            </label>
            <label class="mini-select">
              <span>Colour preset</span>
              <select id="presetControl">
                <option value="nerv">NERV orange</option>
                <option value="magi">MAGI green</option>
              </select>
            </label>
            <label class="toggle compact-toggle">
              <input id="lowPowerToggle" type="checkbox" />
              <span>Low-power mode</span>
            </label>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
